<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="천하 인장">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2523e"/>
      <stop offset=".55" stop-color="#b8322a"/>
      <stop offset="1" stop-color="#7a1c17"/>
    </linearGradient>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <mask id="cut">
      <rect width="64" height="64" fill="#fff"/>
      <g stroke="#000" stroke-width="3.4" stroke-linecap="square" fill="none">
      <!-- 오른쪽 열부터 읽는다 — 天(오른쪽): 가로획 둘 + 人 -->
        <path d="M37 16h14"/><path d="M35 26h18"/>
        <path d="M44 26c0 8-3 14-9 19"/><path d="M44.6 28.5c2 6.5 4.6 11.5 8.4 15.5"/>
        <!-- 下(왼쪽): 가로획 + 세로획 + 점 -->
        <path d="M12 15h17"/><path d="M20.5 15v34"/><path d="M22.8 25.5l5.6 5.6"/>
      </g>
      <!-- 낙관 테두리 안쪽 선 -->
      <rect x="7" y="7" width="50" height="50" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
    </mask>
  </defs>
  <g filter="url(#rough)">
    <rect x="3" y="3" width="58" height="58" rx="6" fill="url(#ink)" mask="url(#cut)"/>
  </g>
  <path d="M8 10c4-3 10-4 14-3" stroke="#ffd2c2" stroke-opacity=".45" stroke-width="1.4" fill="none" stroke-linecap="round"/>
</svg>
