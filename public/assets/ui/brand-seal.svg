<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="천하 인장">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2523e"/>
      <stop offset=".55" stop-color="#b8322a"/>
      <stop offset="1" stop-color="#7a1c17"/>
    </linearGradient>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <mask id="cut">
      <rect width="64" height="64" fill="#fff"/>
      <!-- 한글 「천하」를 왼쪽에서 오른쪽으로 새긴 주홍 인장 -->
      <text x="32" y="43.5" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','NanumMyeongjo','Batang','AppleMyungjo','Malgun Gothic',serif" font-weight="900" font-size="25" letter-spacing="-1" fill="#000">천하</text>
      <!-- 낙관 테두리 안쪽 선 -->
      <rect x="7" y="7" width="50" height="50" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
    </mask>
  </defs>
  <g filter="url(#rough)">
    <rect x="3" y="3" width="58" height="58" rx="6" fill="url(#ink)" mask="url(#cut)"/>
  </g>
  <path d="M8 10c4-3 10-4 14-3" stroke="#ffd2c2" stroke-opacity=".45" stroke-width="1.4" fill="none" stroke-linecap="round"/>
</svg>
